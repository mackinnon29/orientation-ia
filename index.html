<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orientation IA - Trouvez votre voie avec Gemini</title>
    <meta name="description"
        content="Découvrez votre futur métier grâce à un dialogue intelligent et personnalisé avec l'IA Gemini.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="app">
        <!-- Le contenu sera injecté ici ou structuré directement -->
        <header>
            <nav class="glass">
                <div class="logo text-gradient-emerald">Orientation IA</div>
                <div class="behavior-selector">
                    <select id="ai-behavior" class="glass">
                        <option value="nice">Sympa 😊</option>
                        <option value="caustic">Caustique 🔥</option>
                    </select>
                </div>
            </nav>
        </header>

        <main id="main-content">
            <!-- Section Hero (Landing) -->
            <section id="hero-section">
                <h1 class="text-gradient-emerald">Tracez votre avenir avec l'IA.</h1>
                <p>Une conversation simple pour découvrir des métiers qui vous ressemblent.</p>
                <button id="start-btn" class="glass">Commencer l'aventure</button>
            </section>

            <!-- Section Chat (Masquée par défaut) -->
            <section id="chat-section" class="hidden">
                <div id="chat-container" class="glass">
                    <div id="chat-messages">
                        <!-- Les messages seront injectés ici -->
                    </div>
                    <div id="chat-input-area">
                        <input type="text" id="user-input" placeholder="Répondez ici..." autocomplete="off">
                        <button id="send-btn">
                            <svg viewBox="0 0 24 24" width="24" height="24">
                                <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 Orientation IA - Propulsé par Gemini</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="js/ai-service.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
